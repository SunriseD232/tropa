name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Сборка выпуска — только вручную (Actions → CI → Run workflow): выпуск, созданный через сайт,
  # не должен запускать сборку, которая подменит установщик с подписанным хэшем.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпуска, например v0.2.0 (черновик создаётся на текущем main)'
        required: true

# Минимальные права токена (docs/02-security.md, §3.9)
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      # Actions закреплены по хэшу коммита, а не по тегу: тег можно перевесить.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Tropa.slnx --locked-mode

      - name: Fetch cores (hash-verified)
        shell: powershell
        run: ./tools/fetch-cores.ps1

      - name: Fetch rule-sets (hash-verified)
        shell: powershell
        run: ./tools/fetch-geo.ps1

      - name: Build
        run: dotnet build Tropa.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Tropa.slnx --no-build -c Release

  # Выпуск вручную: самодостаточная программа, установщик (Inno Setup есть в образе windows-latest)
  # и SHA256SUMS — в черновик выпуска на GitHub. Права на запись — только у этой задачи.
  # Манифест обновлений здесь НЕ подписывается: закрытый ключ только у владельца (docs/10-release.md).
  # Владелец прикладывает manifest.json и manifest.json.sig к черновику и публикует его.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Tropa.slnx --locked-mode

      - name: Build release
        shell: powershell
        run: ./tools/build-release.ps1 -SkipTests

      - name: Draft GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            out/Tropa-*-setup.exe
            out/SHA256SUMS.txt
