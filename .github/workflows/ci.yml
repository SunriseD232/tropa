name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Минимальные права токена (docs/02-security.md, §3.9)
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      # Actions закреплены по хэшу коммита, а не по тегу: тег можно перевесить.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore (locked)
        run: dotnet restore Tropa.slnx --locked-mode

      - name: Fetch cores (hash-verified)
        shell: powershell
        run: ./tools/fetch-cores.ps1

      - name: Fetch rule-sets (hash-verified)
        shell: powershell
        run: ./tools/fetch-geo.ps1

      - name: Build
        run: dotnet build Tropa.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Tropa.slnx --no-build -c Release

      # Выпуск по тегу v*: самодостаточная программа, установщик (Inno Setup есть в образе windows-latest)
      # и SHA256SUMS. Манифест обновлений здесь НЕ подписывается: закрытый ключ только у владельца (docs/10-release.md).
      - name: Build release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: ./tools/build-release.ps1 -SkipTests

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tropa-release
          path: |
            out/Tropa-*-setup.exe
            out/SHA256SUMS.txt
          if-no-files-found: error
